<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/aba_b.css">
<title>Solicitações</title>
</head>

<body>
<script>
if (localStorage.getItem("logado") !== "true") {
  window.location.href = "login.html";
}
</script>

<header>
  <a class="pulse" href="index.html"><h1>PulseVida ❤️</h1></a>
    <nav>
      <a href="aba_a.html">Solicitar</a>
      <a href="aba_b.html">Solicitações</a>
      <a href="aba_c.html">Agendamento</a>
      <a href="aba_d.html">Recomendações</a>
    </nav>
</header>

<h1 class="titulo">Solicitações em andamento</h1>

<div class="textos">
<ul id="listaSolicitacoes"></ul>
</div>

<!-- Botão Flutuante no Canto Inferior Direito para Retornar à Página Principal -->
<a href="index.html" style="position: fixed; bottom: 20px; right: 20px; background-color: #007bff; color: white; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; display: flex; align-items: center; gap: 8px; font-family: Arial, sans-serif;">
  ⬅ Início
</a>

<script>
document.addEventListener("DOMContentLoaded", () => {

  let lista = JSON.parse(localStorage.getItem("solicitacoes")) || [];
  let ul = document.getElementById("listaSolicitacoes");

  function renderizar() {
    ul.innerHTML = "";

    if (lista.length === 0) {
      ul.innerHTML = "<li>Nenhuma solicitação encontrada</li>";
      return;
    }

    lista.forEach((s, index) => {
      let li = document.createElement("li");
      let pressaoFormatada = "-";

      if (s.pressao) {
        let partes = s.pressao.split("/");
        if (partes.length === 2) {
          let sistolica = parseInt(partes[0]);
          let diastolica = parseInt(partes[1]);
          pressaoFormatada = `${sistolica}/${diastolica} mmHg`;
        }
      }

      // Compatibiliza campos salvos tanto por formulários antigos quanto pelo agendamento (aba_c)
      let nomeExibicao = s.nome || s.nomePaciente || "-";
      let problemaExibicao = s.problema || s.especialidade || s.servico || "-";
      let unidadeExibicao = s.hospital ? `Unidade: ${s.hospital}` : `${s.rua || "-"}, ${s.numero || "-"} - ${s.bairro || "-"}, ${s.cidade || "-"}`;

      li.innerHTML = `
        <div class="card">
          <p><strong>Nome:</strong> ${nomeExibicao}</p>
          <p><strong>Idade/CPF:</strong> ${s.idade || s.cpf || "-"}</p>
          <p><strong>Pressão:</strong> ${pressaoFormatada}</p>
          <p><strong>Detalhes:</strong> ${unidadeExibicao}</p>
          <p><strong>Problema/Serviço:</strong> ${problemaExibicao}</p>
          ${s.dataConsulta ? `<p><strong>Data/Hora:</strong> ${s.dataConsulta} às ${s.horarioConsulta || ""}</p>` : ""}
          <button onclick="excluir(${index})">❌ Excluir</button>
        </div>
      `;

      ul.appendChild(li);
    });
  }

  window.excluir = function(index) {
    if (confirm("Deseja excluir esta solicitação?")) {
      lista.splice(index, 1);
      localStorage.setItem("solicitacoes", JSON.stringify(lista));
      renderizar();
    }
  }

  renderizar();
});
</script>

</body>
</html>
